# Publie le simulateur sur GitHub Pages à chaque push sur main :
# tests → build → copie du site sur la branche gh-pages.
# Réglage requis une fois : Settings → Pages → Source « Deploy from a branch », branche gh-pages, dossier / (root).
# (La méthode « GitHub Actions » + deploy-pages restait bloquée sur « updating_pages » lors de la mise en place, nov. 2026.)
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tests
        run: node tests/run.mjs
      - name: Build
        run: node scripts/build.mjs
      - name: Publier sur la branche gh-pages
        run: |
          mkdir -p _site && cd _site
          cp ../dist/index.html ../dist/forge-embervale.html .
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site publié depuis ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
